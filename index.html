<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo || Login</title>

    <!-- Fav icon  -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- Tailwind & DaisyUI CDN  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="import" href="./home.html" />
    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md mx-auto bg-slate-950 relative overflow-hidden text-white">
    <!-- Animated Background Shapes -->
    <div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/30 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute top-1/2 -right-24 w-72 h-72 bg-secondary/30 rounded-full blur-3xl animate-bounce" style="animation-duration: 10s;"></div>
    <div class="absolute -bottom-24 left-1/2 w-64 h-64 bg-accent/30 rounded-full blur-3xl animate-pulse"></div>

    <div class="relative z-10 px-4">
      <div class="logo w-[180px] mx-auto pt-24 drop-shadow-2xl">
        <img src="./assets/Logo-full.png" alt="Payoo Logo" class="animate-in fade-in zoom-in duration-1000 brightness-0 invert" />
      </div>

      <div class="form pt-12">
        <div class="card bg-white/10 backdrop-blur-2xl border border-white/20 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-[2.5rem] p-2">
          <div class="card-body">
            <h1 class="text-2xl font-black text-center mb-4 text-white">Login to Pay<span class="text-primary">oo</span></h1>
            <fieldset class="fieldset space-y-4">
              <div>
                <label class="label text-white/70 font-semibold text-sm px-4">Mobile Number</label>
                <div class="relative">
                  <span class="absolute left-5 top-1/2 -translate-y-1/2 text-neutral/40"><i class="fa-solid fa-phone"></i></span>
                  <input
                    id="input-number"
                    maxlength="11"
                    minlength="11"
                    type="text"
                    class="input rounded-full bg-base-200/50 border-none w-full pl-12 focus:ring-2 focus:ring-primary/20 transition-all"
                    placeholder="017XXXXXXXX"
                    value="01234567890"
                  />
                </div>
              </div>
              
              <div>
                <label class="label text-neutral/70 font-semibold text-sm px-4">4 Digit Pin</label>
                <div class="relative">
                  <span class="absolute left-5 top-1/2 -translate-y-1/2 text-neutral/40"><i class="fa-solid fa-lock"></i></span>
                  <input
                    id="input-pin"
                    maxlength="4"
                    minlength="4"
                    type="password"
                    class="input rounded-full bg-base-200/50 border-none w-full pl-12 focus:ring-2 focus:ring-primary/20 transition-all"
                    placeholder="1234"
                    value="1234"
                  />
                </div>
              </div>

              <button class="btn btn-primary mt-6 rounded-full shadow-lg shadow-primary/30 h-16 text-lg font-bold uppercase tracking-wider" id="login-btn">
                Continue <i class="fa-solid fa-arrow-right ml-2"></i>
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
    <script src="./script/login.js"></script>
  </body>
</html>
