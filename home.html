<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo || Home</title>

    <!-- Fav icon  -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- Tailwind & DaisyUI CDN  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .premium-gradient {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      }
      .nav-active {
        color: var(--color-primary);
        transform: translateY(-5px);
      }
      .section-transition {
        animation: fadeIn 0.4s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md mx-auto bg-slate-900 relative overflow-hidden text-white">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-80 premium-gradient rounded-b-[3.5rem] shadow-2xl"></div>

    <div class="relative z-10">
      <header class="sticky top-0 z-50 backdrop-blur-xl bg-white/10 border-b border-white/10">
        <section class="w-11/12 mx-auto py-4 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="avatar online">
              <div class="w-12 rounded-full ring-2 ring-white/50 ring-offset-2 ring-offset-primary">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" />
              </div>
            </div>
            <div>
              <p class="text-[10px] uppercase tracking-widest text-white/60 font-bold">Welcome back</p>
              <h2 class="text-lg font-black text-white">Akash Ahmed</h2>
            </div>
          </div>
          <div class="right">
            <a href="./index.html" class="btn btn-circle btn-sm bg-white/20 backdrop-blur-md border-none text-white hover:bg-white/40">
              <i class="fa-solid fa-power-off"></i>
            </a>
          </div>
        </section>
      </header>

    <main class="w-11/12 mx-auto mt-12 pb-12">
      <section id="main-home">
        <!-- Premium Balance Card -->
        <div class="premium-gradient p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden mb-8 group">
          <div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-white/10 rounded-full blur-3xl group-hover:bg-white/20 transition-all duration-700"></div>
          <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
          
          <div class="relative z-10">
            <div class="flex justify-between items-start mb-10">
              <div>
                <p class="text-white/80 text-xs font-black uppercase tracking-widest mb-1">Available Balance</p>
                <h2 class="text-5xl font-black text-white flex items-center gap-3 drop-shadow-lg">
                  $ <span id="balance">45000</span>
                </h2>
              </div>
              <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center">
                <img src="./assets/logo.png" class="w-8 h-8 invert brightness-0" alt="">
              </div>
            </div>
            
            <div class="flex justify-between items-end">
              <div>
                <p class="text-white/80 text-[10px] font-black uppercase tracking-widest mb-1">Card Holder</p>
                <p class="text-white font-black tracking-widest text-sm uppercase">Akash Ahmed</p>
              </div>
              <div class="text-right">
                <p class="text-white/80 text-[10px] font-black uppercase tracking-widest mb-1">Expiry</p>
                <p class="text-white font-black text-sm tracking-widest">12/28</p>
              </div>
            </div>
          </div>
        </div>

        <section class="mb-10">
          <div class="flex justify-between items-center mb-6 px-1">
            <h2 class="text-xl font-black text-white tracking-tight">Quick Actions</h2>
            <span class="px-3 py-1 bg-primary/20 text-primary rounded-full text-[10px] font-black uppercase tracking-widest">New</span>
          </div>
          
          <div class="grid grid-cols-3 gap-5">
            <button onclick="showOnly('add-money')" class="flex flex-col items-center gap-3 p-4 bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl hover:bg-white/10 transition-all duration-300 group shadow-sm hover:shadow-xl hover:-translate-y-1">
              <div class="w-14 h-14 rounded-2xl bg-blue-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                <img src="./assets/opt-1.png" class="w-8 h-8" alt="">
              </div>
              <p class="text-[12px] font-bold text-white/90">Add Money</p>
            </button>

            <button onclick="showOnly('cashout')" class="flex flex-col items-center gap-3 p-4 bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl hover:bg-white/10 transition-all duration-300 group shadow-sm hover:shadow-xl hover:-translate-y-1">
              <div class="w-14 h-14 rounded-2xl bg-orange-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                <img src="./assets/opt-2.png" class="w-8 h-8" alt="">
              </div>
              <p class="text-[12px] font-bold text-white/90">Cashout</p>
            </button>

            <button onclick="showOnly('transfer-money')" class="flex flex-col items-center gap-3 p-4 bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl hover:bg-white/10 transition-all duration-300 group shadow-sm hover:shadow-xl hover:-translate-y-1">
              <div class="w-14 h-14 rounded-2xl bg-green-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                <img src="./assets/opt-3.png" class="w-8 h-8" alt="">
              </div>
              <p class="text-[12px] font-bold text-white/90">Transfer</p>
            </button>

            <button onclick="showOnly('get-bonus')" class="flex flex-col items-center gap-3 p-4 bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl hover:bg-white/10 transition-all duration-300 group shadow-sm hover:shadow-xl hover:-translate-y-1">
              <div class="w-14 h-14 rounded-2xl bg-purple-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                <img src="./assets/opt-4.png" class="w-8 h-8" alt="">
              </div>
              <p class="text-[12px] font-bold text-white/90">Get Bonus</p>
            </button>

            <button onclick="showOnly('pay-bill')" class="flex flex-col items-center gap-3 p-4 bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl hover:bg-white/10 transition-all duration-300 group shadow-sm hover:shadow-xl hover:-translate-y-1">
              <div class="w-14 h-14 rounded-2xl bg-red-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                <img src="./assets/opt-5.png" class="w-8 h-8" alt="">
              </div>
              <p class="text-[12px] font-bold text-white/90">Pay Bill</p>
            </button>

            <button onclick="showOnly('history')" class="flex flex-col items-center gap-3 p-4 bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl hover:bg-white/10 transition-all duration-300 group shadow-sm hover:shadow-xl hover:-translate-y-1">
              <div class="w-14 h-14 rounded-2xl bg-cyan-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                <img src="./assets/opt-6.png" class="w-8 h-8" alt="">
              </div>
              <p class="text-[12px] font-bold text-white/90">History</p>
            </button>
          </div>
        </section>
      </section>

    <section id="add-money" class="py-8 hidden">
      <div class="flex items-center gap-4 mb-8">
        <button onclick="showOnly('home')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-neutral">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 class="text-2xl font-black text-white">Add Money</h2>
      </div>
      
      <div class="glass-card w-full shadow-xl rounded-[2.5rem] p-8">
          <div class="space-y-6">
            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Select Bank</label>
              <select id="add-money-bank" class="select rounded-3xl bg-slate-100 border-none w-full h-14 focus:ring-2 focus:ring-primary/20 text-slate-900">
                <option disabled selected>Select Bank</option>
                <option value="Brac Bank">Brac Bank</option>
                <option value="City Bank">City Bank</option>
                <option value="Bank Asia">Bank Asia</option>
                <option value="Dutch-Bangla Bank">Dutch-Bangla Bank</option>
              </select>
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Account Number</label>
              <input maxlength="11" minlength="11" id="add-money-number" type="text" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="01XXXXXXXXX" value="01234567890" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Amount</label>
              <input id="add-money-amount" type="number" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="Enter amount" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Pin Number</label>
              <input id="add-money-pin" maxlength="4" type="password" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="••••" />
            </div>

            <button class="btn btn-primary w-full h-14 rounded-3xl text-lg font-bold shadow-lg shadow-primary/30" id="add-money-btn">
              Add Money <i class="fa-solid fa-plus-circle ml-2"></i>
            </button>
          </div>
      </div>
    </section>

    <section id="cashout" class="py-8 hidden">
      <div class="flex items-center gap-4 mb-8">
        <button onclick="showOnly('home')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-neutral">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 class="text-2xl font-black text-white">Cashout</h2>
      </div>
      
      <div class="glass-card w-full shadow-xl rounded-[2.5rem] p-8">
          <div class="space-y-6">
            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Agent Number</label>
              <input id="cashout-number" type="text" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="01XXXXXXXXX" value="01234567890" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Amount</label>
              <input id="cashout-amount" type="number" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="Enter amount" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Pin Number</label>
              <input id="cashout-pin" maxlength="4" type="password" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="••••" />
            </div>

            <button class="btn btn-secondary w-full h-14 rounded-3xl text-lg font-bold shadow-lg shadow-secondary/30" id="cashout-btn">
              Withdraw <i class="fa-solid fa-money-bill-transfer ml-2"></i>
            </button>
          </div>
      </div>
    </section>

    <section id="transfer-money" class="py-8 hidden">
      <div class="flex items-center gap-4 mb-8">
        <button onclick="showOnly('home')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-neutral">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 class="text-2xl font-black text-white">Transfer Money</h2>
      </div>
      
      <div class="glass-card w-full shadow-xl rounded-[2.5rem] p-8">
          <div class="space-y-6">
            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Recipient Account</label>
              <input id="transfer-number" type="text" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="01XXXXXXXXX" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Amount</label>
              <input id="transfer-amount" type="number" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="Enter amount" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Pin Number</label>
              <input id="transfer-pin" maxlength="4" type="password" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="••••" />
            </div>

            <button class="btn btn-accent w-full h-14 rounded-3xl text-lg font-bold shadow-lg shadow-accent/30" id="transfer-btn">
              Send Now <i class="fa-solid fa-paper-plane ml-2"></i>
            </button>
          </div>
      </div>
    </section>

    <section id="get-bonus" class="py-8 hidden">
      <div class="flex items-center gap-4 mb-8">
        <button onclick="showOnly('home')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-neutral">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 class="text-2xl font-black text-white">Get Bonus</h2>
      </div>
      
      <div class="glass-card w-full shadow-xl rounded-[2.5rem] p-8">
          <div class="space-y-6">
            <div>
              <label class="label text-neutral/70 font-bold text-sm px-2">Coupon Code</label>
              <div class="relative">
                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-primary"><i class="fa-solid fa-ticket"></i></span>
                <input id="coupon-code" type="text" class="input rounded-3xl bg-slate-100 border-none w-full h-14 pl-12" placeholder="PAYOO2024" />
              </div>
            </div>

            <button class="btn btn-primary w-full h-14 rounded-3xl text-lg font-bold shadow-lg shadow-primary/30" id="get-bonus-btn">
              Claim Bonus <i class="fa-solid fa-gift ml-2"></i>
            </button>
          </div>
      </div>
    </section>

    <section id="pay-bill" class="py-8 hidden">
      <div class="flex items-center gap-4 mb-8">
        <button onclick="showOnly('home')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-neutral">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 class="text-2xl font-black text-white">Pay Bill</h2>
      </div>
      
      <div class="glass-card w-full shadow-xl rounded-[2.5rem] p-8">
          <div class="space-y-6">
            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Select Biller</label>
              <select id="pay-bill-biller" class="select rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900">
                <option disabled selected>Select Utility</option>
                <option value="Electricity Bill">Electricity Bill</option>
                <option value="Gas Bill">Gas Bill</option>
                <option value="Water Bill">Water Bill</option>
                <option value="Internet Bill">Internet Bill</option>
              </select>
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Account Number</label>
              <input id="pay-bill-number" type="text" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="Enter ID" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Amount</label>
              <input id="pay-bill-amount" type="number" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="Enter amount" />
            </div>

            <div>
              <label class="label text-slate-800 font-black text-sm px-2">Pin Number</label>
              <input id="pay-bill-pin" maxlength="4" type="password" class="input rounded-3xl bg-slate-100 border-none w-full h-14 text-slate-900" placeholder="••••" />
            </div>

            <button class="btn btn-primary w-full h-14 rounded-3xl text-lg font-bold shadow-lg shadow-primary/30" id="pay-bill-btn">
              Pay Now <i class="fa-solid fa-file-invoice-dollar ml-2"></i>
            </button>
          </div>
      </div>
    </section>

    <section id="history" class="py-5 rounded-2xl hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-black text-white">Transaction History</h2>
        <a href="#" class="text-white/70 text-sm font-bold">View All</a>
      </div>
      <div class="space-y-4" id="history-container">
        <!-- History items will be injected here -->
      </div>
    </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-xl border-t border-slate-200 px-6 py-3 z-50 flex justify-between items-center rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
      <button onclick="showOnly('home')" class="flex flex-col items-center gap-1 text-primary group transition-all duration-300">
        <div class="p-2 rounded-xl bg-primary/10 group-active:scale-90 transition-transform">
          <i class="fa-solid fa-house text-xl"></i>
        </div>
        <span class="text-[10px] font-bold">Home</span>
      </button>
      <button onclick="showOnly('history')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-all duration-300 group">
        <div class="p-2 rounded-xl group-active:scale-90 transition-transform">
          <i class="fa-solid fa-clock-rotate-left text-xl"></i>
        </div>
        <span class="text-[10px] font-bold">History</span>
      </button>
      <button onclick="showOnly('add-money')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-all duration-300 group">
        <div class="p-2 rounded-xl group-active:scale-90 transition-transform">
          <i class="fa-solid fa-plus-circle text-xl"></i>
        </div>
        <span class="text-[10px] font-bold">Top Up</span>
      </button>
      <button onclick="showOnly('pay-bill')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-all duration-300 group">
        <div class="p-2 rounded-xl group-active:scale-90 transition-transform">
          <i class="fa-solid fa-file-invoice-dollar text-xl"></i>
        </div>
        <span class="text-[10px] font-bold">Bills</span>
      </button>
    </nav>

    </div>

    <script src="./script/machine.js"></script>
    <script src="./script/add-money.js"></script>
    <script src="./script/cashout.js"></script>
    <script src="./script/transfer-money.js"></script>
    <script src="./script/get-bonus.js"></script>
    <script src="./script/pay-bill.js"></script>
  </body>
</html>
